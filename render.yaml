services:
  # ShopSphere Backend API on Render
  - type: web
    name: shopsphere-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false # Set to your Vercel frontend URL, e.g. https://shopsphere.vercel.app
      - key: MONGODB_URI
        sync: false # Set to your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure 256-bit random key
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RAZORPAY_KEY_ID
        sync: false # Set from https://dashboard.razorpay.com/#/access/api_keys
      - key: RAZORPAY_KEY_SECRET
        sync: false # Set from https://dashboard.razorpay.com/#/access/api_keys
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false # Set from Razorpay Webhook settings
